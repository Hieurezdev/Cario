[project]
name = "cario"
version = "0.1.0"
description = "FastAPI backend for the CARIO career development platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pymongo>=4.10,<5.0",
    "PyJWT>=2.10,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
cario = "cario.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
